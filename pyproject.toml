[tool.poetry]
name = "rag"
version = "0.1.0"
description = "Base inicial para uma aplicação RAG com FastAPI, SQLAlchemy e PostgreSQL"
authors = ["Luiz F"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
sqlalchemy = "^2.0.40"
psycopg = { extras = ["binary"], version = "^3.2.0" }
pydantic = "^2.11.0"
pydantic-settings = "^2.8.0"
alembic = "^1.15.0"
pgvector = "^0.3.6"
alembic-utils = "^0.8.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.11.0"

[tool.poetry.scripts]
start = "app.main:run"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
