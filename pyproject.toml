[tool.poetry]
name = "rag"
version = "0.1.0"
description = "Base inicial para uma aplicação RAG com FastAPI, SQLAlchemy e PostgreSQL"
authors = ["Luiz F"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
sqlalchemy = "^2.0.40"
psycopg = { extras = ["binary"], version = "^3.2.0" }
pydantic = "^2.11.0"
pydantic-settings = "^2.8.0"
alembic = "^1.15.0"
pgvector = "^0.3.6"
alembic-utils = "^0.8.8"
python-multipart = "^0.0.20"
pypdf = "^5.5.0"
langchain-text-splitters = "^0.3.8"
beautifulsoup4 = "^4.12.3"
reportlab = "^4.2.0"
rank-bm25 = "^0.2.2"
nltk = "^3.8.1"
ragas = "^0.2.10"
langchain-ollama = "^0.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.11.0"
httpx = "^0.28.1"

[tool.poetry.scripts]
start = "app.main:run"
scrape-lgpd = "app.services.lgpd_scraper:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
