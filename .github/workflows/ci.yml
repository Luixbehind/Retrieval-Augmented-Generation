name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment file
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL_DOCKER: ${{ secrets.DATABASE_URL_DOCKER }}
          APP_NAME: ${{ vars.APP_NAME }}
          API_V1_PREFIX: ${{ vars.API_V1_PREFIX }}
          HOST: ${{ vars.HOST }}
          PORT: ${{ vars.PORT }}
          RELOAD: ${{ vars.RELOAD }}
        run: |
          cat > .env <<EOF
          POSTGRES_DB=${POSTGRES_DB:-rag}
          POSTGRES_USER=${POSTGRES_USER:-postgres}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
          DATABASE_URL_DOCKER=${DATABASE_URL_DOCKER:-postgresql+psycopg://postgres:postgres@db:5432/rag}
          APP_NAME=${APP_NAME:-RAG API}
          API_V1_PREFIX=${API_V1_PREFIX:-/api/v1}
          HOST=${HOST:-0.0.0.0}
          PORT=${PORT:-8000}
          RELOAD=${RELOAD:-false}
          EOF

      - name: Start stack
        run: docker compose up --build -d
